<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#243044" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />
  
  <!-- System Architecture Flow diagram visual on right -->
  <g transform="translate(680, 140)">
    <!-- Node 1: Problem -->
    <rect x="0" y="0" width="170" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <text x="20" y="32" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">01 // CONTEXT</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Business Problem</text>

    <!-- Flow line 1 -->
    <path d="M 170 35 L 240 35" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="238,31 246,35 238,39" fill="#B45309" />

    <!-- Node 2: Strategy -->
    <rect x="250" y="0" width="170" height="70" rx="8" fill="#1E293B" stroke="#B45309" stroke-width="1.5" />
    <text x="270" y="32" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">02 // STRATEGY</text>
    <text x="270" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Marketing & Need</text>

    <!-- Flow line 2 down -->
    <path d="M 335 70 L 335 120" fill="none" stroke="#635B87" stroke-width="2" />
    <polygon points="331,118 335,126 339,118" fill="#635B87" />

    <!-- Node 3: Backend & AI -->
    <rect x="230" y="130" width="210" height="85" rx="8" fill="#1E293B" stroke="#635B87" stroke-width="2" />
    <text x="250" y="160" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">03 // ENGINEERING</text>
    <text x="250" y="182" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Backend & AI Core</text>
    <text x="250" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Django APIs · LLMs · Pipelines</text>

    <!-- Flow line 3 left -->
    <path d="M 230 172 L 135 172 L 135 220" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="131,218 135,226 139,218" fill="#475569" />

    <!-- Node 4: Automation & Outcome -->
    <rect x="30" y="230" width="210" height="85" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="50" y="260" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">04 // OUTCOME</text>
    <text x="50" y="282" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Automation & Scale</text>
    <text x="50" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Reliable workflows delivered</text>
  </g>

  <!-- Left: Profile and Identity -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#F59E0B" />
    <text x="32" y="22" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">ENGINEERING + MARKETING THINKING</text>

    <!-- Name -->
    <text x="0" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Abdulrahman Elshafie</text>
    
    <!-- Title -->
    <text x="0" y="135" fill="#D97706" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Backend &amp; AI Engineer</text>

    <!-- Value proposition description -->
    <text x="0" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">Building backend APIs, AI workflows, and automation</text>
    <text x="0" y="218" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">grounded in real user behavior and business problems.</text>

    <!-- Verified tags -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="18" y="21" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Python · Django</text>

      <rect x="142" y="0" width="145" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="21" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">LLMs &amp; AI Pipelines</text>

      <rect x="299" y="0" width="150" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="317" y="21" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Workflow Automation</text>
    </g>

    <!-- Footer meta -->
    <text x="0" y="360" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">abdulrahman-saeed-elshafie.com · 6 October City, Giza, Egypt</text>
  </g>
</svg>
